<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <title>Movie App</title>
</head>

<body>
    <!-- nav open -->
    <nav
        class="flex items-center gap-4 justify-between h-16 md:h-20 bg-black border-b border-white px-12 sticky top-0 z-50">
        <div class="flex gap-4">
            <a href="#" class="text-lime-600 text-4xl font-semibold">YTS.GG</a>
        </div>
        <!-- Mobile screen -->

        <div class="flex md:hidden gap-3">
            <a href="">
                <i class="fa-solid fa-magnifying-glass text-white text-2xl"></i>
            </a>
            <span class="text-lime-600 text-2xl font-bold">4K</span>
            <a>
                <i class="fa-solid fa-chart-bar text-white text-2xl"></i>
            </a>
            <a href="">
                <i class="fa-solid fa-list-ul text-white text-2xl"></i>
            </a>
            <a href="">
                <i class="fa-regular fa-user text-white text-2xl"></i>
            </a>
        </div>


        <!-- medium screen Navbar -->
        <div class="hidden md:flex lg:hidden item-center gap-4">
            <div>
                <h1 class="text-[#1f1f1f] text-2xl">HD movies at the smallest file size</h1>
            </div>


            <div class="flex gap-3">
                <a href="">
                    <i class="fa-solid fa-magnifying-glass text-white text-2xl"></i>
                </a>
                <span class="text-lime-600 text-2xl font-bold">4K</span>
                <a href="">
                    <i class="fa-solid fa-chart-bar text-white text-2xl"></i>
                </a>
                <a href="">
                    <i class="fa-solid fa-list-ul text-white text-2xl"></i>
                </a>
                <a href="">
                    <i class="fa-regular fa-user text-white text-2xl"></i>
                </a>
            </div>
        </div>


        <!-- Large/Desktop -->
        <div class="hidden lg:flex gap-2">
            <div class="relative">
                <input type="text" placeholder="Quick Search"
                    class=" w-full text-gray-400 rounded-full px-12 py-2 border border-gray-600">
                <a><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-600"></i>
                </a>
            </div>
            <div class="flex gap-4 p-2">
                <a href="" class="text-gray-600 text-md font-bold">Home</a>
                <a href="" class="text-lime-600 font-bold">4K</a>
                <a href="" class="text-gray-600 font-bold">Trending</a>
                <a href="" class="text-gray-600 font-bold">Browse Movies</a>
            </div>
            <div class="flex gap-2 p-2">
                <a href="" class="text-white font-bold">Login</a>
                <span class="text-gray-600">|</span>
                <a href="" class="text-white font-bold">Register</a>
            </div>
        </div>
    </nav>
    <!-- Nav close -->
    <!-- Section 1 Open -->
    <section class="bg-black h-auto pb-20">
        <div class="w-fit mx-auto pt-15">
            <h2 class="text-2xl font-bold text-[#1f1f1f] mb-5">Search Term on YTS:</h2>

            <div class="flex flex-col md:flex-row justify-center gap-4">
                <div>
                    <input type="text" class="px-60 md:px-80 lg:px-95 py-3 bg-[#1f1f1f] rounded-md">
                </div>
                <div>
                    <button class="bg-lime-600 px-6 py-3 rounded-md text-white font-bold text-md">Search</button>
                </div>
            </div>






            <!-- Filters -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-5 mt-5">

                <!-- Quality -->
                <div>
                    <label class="block text-[#1f1f1f] mb-2 font-bold">
                        Quality:
                    </label>

                    <select class="w-full bg-[#1f1f1f] text-gray-300 px-3 py-3 rounded-md">
                        <option>All</option>
                        <option>720p</option>
                        <option>1080p</option>
                        <option>2160p</option>
                    </select>
                </div>


                <!-- Genre -->
                <div>
                    <label class="block text-[#1f1f1f] mb-2 font-bold">
                        Genre:
                    </label>

                    <select class="w-full bg-[#1f1f1f] text-gray-300 px-3 py-3 rounded-md">
                        <option>All</option>
                        <option>Action</option>
                        <option>Comedy</option>
                        <option>Drama</option>
                        <option>Horror</option>
                    </select>
                </div>


                <!-- Rating -->
                <div>
                    <label class="block text-[#1f1f1f] mb-2 font-bold">
                        Rating:
                    </label>

                    <select class="w-full bg-[#1f1f1f] text-gray-300 px-3 py-3 rounded-md">
                        <option>All</option>
                        <option>9+</option>
                        <option>8+</option>
                        <option>7+</option>
                        <option>6+</option>
                        <option>5+</option>
                        <option>4+</option>
                        <option>3+</option>
                        <option>2+</option>
                        <option>1+</option>
                    </select>
                </div>


                <!-- Year -->
                <div>
                    <label class="block text-[#1f1f1f] mb-2 font-bold">
                        Year:
                    </label>

                    <select class="w-full bg-[#1f1f1f] text-gray-300 px-3 py-3 rounded-md">
                        <option>All</option>
                        <option>2026</option>
                        <option>2025</option>
                        <option>2024</option>
                        <option>2023</option>
                    </select>
                </div>


                <!-- Language -->
                <div>
                    <label class="block text-[#1f1f1f] mb-2 font-bold">
                        Language:
                    </label>

                    <select class="w-full bg-[#1f1f1f] text-gray-300 px-3 py-3 rounded-md">
                        <option>All</option>
                        <option>English</option>
                        <option>French</option>
                        <option>Spanish</option>
                        <option>Hindi</option>
                    </select>
                </div>


                <!-- Order By -->
                <div>
                    <label class="block text-[#1f1f1f] mb-2 font-bold">
                        Order By:
                    </label>

                    <select class="w-full bg-[#1f1f1f] text-gray-400 px-3 py-3 rounded-md">
                        <option>Latest</option>
                        <option>Oldest</option>
                        <option>Rating</option>
                        <option>Popularity</option>
                        <option>Seeds</option>
                        <option>Peers</option>
                        <option>Year</option>
                        <option>IMDb Rating</option>
                        <option>YTS Like</option>
                        <option>Rt Audience</option>
                        <option>Alphabetical</option>
                        <option>Download</option>

                    </select>
                </div>

            </div>

        </div>


    </section>
    <!-- Section 1 Close -->

    <!-- Section 2 Open -->
    <section class="bg-[#1f1f1f] py-5">

        <!-- Heading -->
        <h2 class="text-center text-lime-600 text-2xl mb-8">
            YTS YIFY Movies
        </h2>

        <!-- Pagination -->
        <div class="flex justify-center gap-1">

            <a href="" class="bg-lime-600 text-white px-4 py-3 rounded-sm">
                1
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition">
                2
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition ">
                3
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition">
                4
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition">
                5
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition">
                6
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition">
                7
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition">
                8
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition">
                ...
            </a>

            <a href="" class="border border-gray-700 text-white px-4 py-3 rounded-sm hover:bg-lime-600 transition">
                Next »
            </a>
        </div>
            <div id="movieContainer" class="movie-container p-5 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
        </div>
    

            

          







    </section>
    

    <script src="script.js"></script>
</body>

</html>
